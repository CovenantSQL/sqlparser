name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - run: go build ./...
      - run: make -B sql.go
      - run: git diff --exit-code -- sql.go
      - run: go vet ./...
      - run: go test -count=1 ./...
